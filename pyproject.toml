[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cffdrs"
version = "0.2.0"
authors = [{ name = "Jordan Evens", email = "jordan.evens@nrcan-rncan.gc.ca" }]
description = "A Python package for CFFDRS"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/nrcan-cfs-fire/cffdrs_py"
"Bug Tracker" = "https://github.com/nrcan-cfs-fire/cffdrs_py/issues"

[dependency-groups]
dev = ["pytest>=7.4.4", "ruff>=0.14.14"]

[tool.ruff]
line-length = 100
