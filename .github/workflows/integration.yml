name: Integration

on:
    pull_request:
        branches:
            - main

jobs:
    run_tests:
        name: Run Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            
            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                version: "0.9.22"

            - name: Cache .venv
              id: cache-venv
              uses: actions/cache@v5
              with:
                path: .venv
                key: ${{ runner.os }}-venv-uv-${{ hashFiles('**/uv.lock') }}

            - name: Install python dependencies
              run: uv sync --frozen

            - name: Run tests
              run: uv run pytest
                